services:
  ovs-node:
    build:
      context: .
      dockerfile: Dockerfile
      target: ovs-node
    container_name: ovs-node
    hostname: ovs-node
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_NICE
    environment:
      - OVS_BRIDGE=${OVS_BRIDGE:-br0}
    volumes:
      - ./logs:/var/log/openvswitch
      - ovs-run:/var/run/openvswitch
    networks:
      mec_net:
        ipv4_address: 10.200.0.10
    restart: unless-stopped

  traffic-gen:
    build:
      context: .
      dockerfile: Dockerfile
      target: traffic-gen
    container_name: traffic-gen
    hostname: traffic-gen
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      - ovs-node
    environment:
      - TARGET_IP=10.200.0.10
      - HTTP_PORT=8080
      - IPERF_PORT=5201
      - INTERVAL_SEC=2
    volumes:
      - ./scripts:/scripts:ro
    networks:
      mec_net:
        ipv4_address: 10.200.0.20
    restart: unless-stopped

  agent-env:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent-env
    container_name: agent-env
    hostname: agent-env
    cap_add:
      - NET_ADMIN
    depends_on:
      - ovs-node
    env_file:
      - path: .env
        required: false
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-llama3.1:8b}
      - OVS_BRIDGE=${OVS_BRIDGE:-br0}
      - OVS_LOG_PATH=/var/log/openvswitch/ovs_telemetry.log
      - OVS_RAW_LOG_PATH=/var/log/openvswitch/ovs-vswitchd.log
      - OVS_RUN_DIR=/var/run/openvswitch
      - METRICS_CSV_PATH=/app/metrics_results.csv
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - ./logs:/var/log/openvswitch
      - ovs-run:/var/run/openvswitch
    networks:
      mec_net:
        ipv4_address: 10.200.0.30
    restart: unless-stopped

volumes:
  ovs-run:

networks:
  mec_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.0.0/24
          gateway: 10.200.0.1
